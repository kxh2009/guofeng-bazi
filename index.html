<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清玄问命 · 八字排盘</title>
<style>
:root{
  --paper:#f2e7d0;
  --ink:#2b2620;
  --ink-soft:#4a4238;
  --seal:#a8281d;
  --seal-dark:#8a1f15;
  --line:#c9b691;
  --gold:#8b6b3d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(ellipse 120% 90% at 50% -10%, rgba(255,252,240,.9), transparent 60%),
    radial-gradient(ellipse 80% 60% at 85% 110%, rgba(196,164,110,.25), transparent 60%),
    repeating-linear-gradient(0deg, rgba(120,90,50,.022) 0 2px, transparent 2px 4px),
    var(--paper);
  min-height:100vh;
  overflow-x:hidden;
}

/* ── 轻烟动效 ── */
.smoke{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.smoke i{
  position:absolute;bottom:-120px;left:50%;
  width:72px;height:72px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.5), rgba(255,255,255,0) 70%);
  filter:blur(10px);
  animation:rise 12s linear infinite;
  opacity:0;
}
.smoke i:nth-child(1){margin-left:-240px;animation-delay:0s;animation-duration:13s}
.smoke i:nth-child(2){margin-left:-90px;animation-delay:3.5s;animation-duration:11s}
.smoke i:nth-child(3){margin-left:70px;animation-delay:1.5s;animation-duration:15s}
.smoke i:nth-child(4){margin-left:210px;animation-delay:6s;animation-duration:12s}
.smoke i:nth-child(5){margin-left:-360px;animation-delay:8s;animation-duration:10s}
@keyframes rise{
  0%{transform:translateY(0) translateX(0) scale(1);opacity:0}
  12%{opacity:.5}
  50%{transform:translateY(-45vh) translateX(32px) scale(1.6);opacity:.28}
  100%{transform:translateY(-96vh) translateX(-22px) scale(2.2);opacity:0}
}

/* ── 布局 ── */
.stage{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:24px 16px 104px}

/* ── 题头 ── */
.masthead{position:relative;text-align:center;padding:36px 70px 24px;animation:fadeIn 1s ease}
.masthead h1{
  font-family:"STKaiti","Kaiti SC","KaiTi","楷体",serif;
  font-weight:700;font-size:52px;letter-spacing:12px;color:var(--ink);
  text-shadow:0 1px 0 rgba(255,255,255,.6);
}
.masthead .sub{
  margin-top:10px;font-family:"STKaiti","Kaiti SC","KaiTi","楷体",serif;
  font-size:15px;letter-spacing:4px;color:#8a7a5c;
}
.seal{
  position:absolute;right:8px;top:22px;width:62px;height:62px;
  background:radial-gradient(circle at 30% 25%, #c03a2a, var(--seal-dark));
  color:#f8ead2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:"STKaiti","Kaiti SC","KaiTi","楷体",serif;font-size:21px;font-weight:700;line-height:1;
  border-radius:8px;transform:rotate(7deg);
  box-shadow:inset 0 0 0 3px rgba(248,234,210,.5), 0 3px 8px rgba(0,0,0,.22);
  animation:stampIn .5s .3s backwards;
}
.seal span{display:block}
@keyframes stampIn{0%{transform:rotate(7deg) scale(2.4);opacity:0}100%{transform:rotate(7deg) scale(1);opacity:1}}

/* ── 聊天卡片 ── */
.chat-card{
  position:relative;
  background:
    repeating-linear-gradient(0deg, rgba(139,107,61,.03) 0 1px, transparent 1px 3px),
    linear-gradient(180deg,#fbf5e6,#f6ecd6);
  border:1px solid var(--line);border-radius:14px;
  box-shadow:0 8px 26px rgba(80,60,30,.18), inset 0 0 60px rgba(180,150,100,.08);
  overflow:hidden;animation:fadeUp .6s .15s backwards;
}
.wood-bar{
  height:14px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 2px, transparent 2px 5px),
    repeating-linear-gradient(0deg, #8a5a2b 0 6px, #7a4e24 6px 8px, #96652f 8px 14px);
  border-bottom:1px solid #5f3d1b;
}
.chat{
  padding:20px 18px 8px;max-height:52vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:14px;
}
.chat::-webkit-scrollbar{width:8px}
.chat::-webkit-scrollbar-thumb{background:#c9b691;border-radius:4px}

.msg{display:flex;gap:10px;max-width:88%;animation:fadeUp .4s ease}
.msg.master{align-self:flex-start}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.avatar{
  flex:0 0 42px;width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:"STKaiti","Kaiti SC","KaiTi","楷体",serif;font-size:20px;font-weight:700;
  color:#f8ead2;box-shadow:0 2px 6px rgba(0,0,0,.25);
}
.avatar.master{background:radial-gradient(circle at 30% 25%, var(--seal), var(--seal-dark))}
.avatar.user{background:radial-gradient(circle at 30% 25%, #6a5c46, #4c4133);font-size:17px}

.bubble{padding:12px 16px;line-height:1.85;font-size:16px;word-break:break-word}
.bubble.master{
  background:
    radial-gradient(ellipse 120% 90% at 20% 0%, rgba(255,255,255,.13), transparent 50%),
    linear-gradient(160deg,#3a342c,#221e19);
  color:#efe6d2;border-radius:4px 18px 18px 18px;
  font-family:"STKaiti","Kaiti SC","KaiTi","楷体",serif;
  box-shadow:0 3px 10px rgba(30,20,10,.3);
}
.bubble.user{
  background:#fdf9ec;color:var(--ink);
  border:1px solid var(--line);border-radius:18px 4px 18px 18px;
  box-shadow:0 2px 6px rgba(90,70,40,.15);
}
.caret{
  display:inline-block;width:2px;height:1.05em;background:#efe6d2;
  vertical-align:-0.15em;margin-left:3px;animation:caret .85s steps(1) infinite;
}
@keyframes caret{50%{opacity:0}}
.typing{display:inline-flex;gap:5px;align-items:center;padding:6px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:#efe6d2;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ── 命盘卡片 ── */
.pan{
  margin-top:12px;padding:12px 14px;background:rgba(252,246,228,.6);
  border:1px solid var(--line);border-radius:10px;
  font-family:"PingFang SC","Hiragino Sans GB",sans-serif;color:var(--ink);
}
.pan .p-title{
  text-align:center;font-family:"STKaiti","Kaiti SC","KaiTi","楷体",serif;
  font-size:13px;letter-spacing:3px;color:var(--gold);margin-bottom:9px;
}
.pan .row{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.pan .pillar{
  flex:1;min-width:62px;text-align:center;background:#fbf3dd;
  border:1px solid var(--line);border-radius:8px;padding:8px 4px;
}
.pan .pillar span{display:block;font-size:11px;color:#8a7a5c;line-height:1.5}
.pan .pillar b{display:block;font-size:21px;font-family:"STKaiti","Kaiti SC","KaiTi","楷体",serif;color:#5a3a1a;letter-spacing:3px;line-height:1.35}
.pan .meta{
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;
  margin-top:10px;font-size:12.5px;color:#6b5a3c;line-height:1.8;
}

/* ── 操作区 ── */
.controls{padding:14px 18px 6px;border-top:1px dashed var(--line)}
.hint{
  font-family:"STKaiti","Kaiti SC","KaiTi","楷体",serif;
  font-size:13.5px;color:#8a7a5c;letter-spacing:1.5px;margin-bottom:10px;
}
.btn-group{display:flex;flex-wrap:wrap;gap:10px}
.qbtn{
  font-family:"STKaiti","Kaiti SC","KaiTi","楷体",serif;font-size:16px;letter-spacing:2px;
  color:#5a3a1a;background:linear-gradient(180deg,#fdf8ea,#f3e7c8);
  border:1px solid var(--line);border-radius:999px;padding:10px 22px;cursor:pointer;
  box-shadow:0 2px 5px rgba(90,70,40,.18);transition:transform .18s, box-shadow .18s;
}
.qbtn:hover{transform:translateY(-2px);box-shadow:0 5px 12px rgba(90,70,40,.25);border-color:#a3844f}
.qbtn:active{transform:translateY(0)}
.qbtn.red{background:linear-gradient(180deg,#b83424,#8f241a);color:#f8ead2;border-color:#7c1d14}
.date-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.date-row input[type=date]{
  font-family:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;
  background:#fdf9ec;color:var(--ink);outline:none;box-shadow:inset 0 1px 3px rgba(90,70,40,.12);
}
.hour-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.hour-btn{padding:7px 4px;font-size:15px;text-align:center}
.hour-btn small{display:block;font-size:10.5px;color:#8a7a5c;font-family:"PingFang SC",sans-serif;letter-spacing:0;font-weight:400}
.link-row{margin-top:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.small-link{
  font-family:"STKaiti","Kaiti SC","KaiTi","楷体",serif;font-size:13px;color:#8a6a3a;
  text-decoration:underline dotted;cursor:pointer;border:none;background:none;padding:4px 2px;
}
.small-link:hover{color:var(--seal)}

/* ── 自由输入栏 ── */
.inputbar{display:flex;gap:10px;padding:12px 18px 18px}
.inputbar input{
  flex:1;font-family:inherit;font-size:15px;padding:10px 14px;
  border:1px solid var(--line);border-radius:999px;background:#fdf9ec;color:var(--ink);
  outline:none;box-shadow:inset 0 1px 3px rgba(90,70,40,.12);
}
.inputbar input:focus{border-color:#a3844f}

/* ── 免责声明 ── */
.disclaimer{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  background:rgba(43,38,32,.94);color:#e8dcc0;text-align:center;
  padding:11px 14px;font-size:13.5px;letter-spacing:2px;
  font-family:"STKaiti","Kaiti SC","KaiTi","楷体",serif;
  border-top:2px solid var(--seal);
  box-shadow:0 -3px 12px rgba(40,30,10,.2);
}
.disclaimer .mark{color:#e08a7a;font-weight:700}

/* ── 响应式 ── */
@media (max-width:560px){
  .masthead h1{font-size:38px;letter-spacing:7px}
  .masthead{padding:30px 56px 20px}
  .seal{width:50px;height:50px;font-size:17px;right:2px;top:18px}
  .msg{max-width:96%}
  .bubble{font-size:15px}
  .chat{max-height:58vh}
  .disclaimer{font-size:12px;letter-spacing:1px}
  .stage{padding:14px 10px 96px}
  .qbtn{font-size:15px;padding:9px 16px}
}
@media (prefers-reduced-motion: reduce){
  .smoke i{animation:none;display:none}
  .caret{animation:none}
}
</style>
</head>
<body>
<div class="smoke" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

<main class="stage">
  <header class="masthead">
    <div class="seal" aria-hidden="true"><span>清</span><span>玄</span></div>
    <h1>清玄问命</h1>
    <p class="sub">八字排盘 · 闲话命理 · 问君一桩心事</p>
  </header>

  <section class="chat-card">
    <div class="wood-bar" aria-hidden="true"></div>
    <div class="chat" id="chat" role="log" aria-live="polite"></div>
    <div class="controls" id="controls"></div>
    <div class="inputbar">
      <input id="free" type="text" maxlength="40" placeholder="与师傅说句话…" autocomplete="off">
      <button class="qbtn red" id="sendBtn">问</button>
    </div>
  </section>
</main>

<footer class="disclaimer"><span class="mark">※</span> 本内容仅供娱乐参考，不构成任何决策建议 <span class="mark">※</span></footer>

<script>
/* ==========================================================
   八字排盘算法 —— 复制自 work/bazi.js（全局 bazi.paiPan）
   ========================================================== */
;(function (global) {
  'use strict';

  // ── 基础数据 ──────────────────────────────────────────
  const TIAN_GAN   = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  const DI_ZHI     = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  const SHI_CHEN   = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  const WUXING     = {
    甲:'木',乙:'木',丙:'火',丁:'火',戊:'土',己:'土',
    庚:'金',辛:'金',壬:'水',癸:'水',
    子:'水',丑:'土',寅:'木',卯:'木',辰:'土',巳:'火',
    午:'火',未:'土',申:'金',酉:'金',戌:'土',亥:'水'
  };
  // 地支藏干（主气/中气/余气）
  const CANG_GAN = {
    子:['癸'],
    丑:['己','癸','辛'],
    寅:['甲','丙','戊'],
    卯:['乙'],
    辰:['戊','乙','癸'],
    巳:['丙','庚','戊'],
    午:['丁','己'],
    未:['己','丁','乙'],
    申:['庚','壬','戊'],
    酉:['辛'],
    戌:['戊','辛','丁'],
    亥:['壬','甲']
  };
  // 六十甲子纳音
  const NA_YIN = [
    '海中金','海中金','炉中火','炉中火','大林木','大林木',
    '路旁土','路旁土','剑锋金','剑锋金','山头火','山头火',
    '涧下水','涧下水','城头土','城头土','白蜡金','白蜡金',
    '杨柳木','杨柳木','泉中水','泉中水','屋上土','屋上土',
    '霹雳火','霹雳火','松柏木','松柏木','长流水','长流水',
    '砂中金','砂中金','山下火','山下火','平地木','平地木',
    '壁上土','壁上土','金箔金','金箔金','覆灯火','覆灯火',
    '天河水','天河水','大驿土','大驿土','钗钏金','钗钏金',
    '桑柘木','桑柘木','大溪水','大溪水','沙中土','沙中土',
    '天上火','天上火','石榴木','石榴木','大海水','大海水'
  ];
  // 节气日期（月/日，用于判断月份）
  // 顺序：小寒、立春、惊蛰、清明、立夏、芒种、小暑、立秋、白露、寒露、立冬、大雪
  const JIE_QI = [
    {name:'小寒', m:1,  d:5  },  // 小寒后 → 丑月（新年）
    {name:'立春', m:2,  d:4  },  // 立春后 → 寅月
    {name:'惊蛰', m:3,  d:5  },  // 惊蛰后 → 卯月
    {name:'清明', m:4,  d:4  },  // 清明后 → 辰月
    {name:'立夏', m:5,  d:5  },  // 立夏后 → 巳月
    {name:'芒种', m:6,  d:5  },  // 芒种后 → 午月
    {name:'小暑', m:7,  d:7  },  // 小暑后 → 未月
    {name:'立秋', m:8,  d:7  },  // 立秋后 → 申月
    {name:'白露', m:9,  d:7  },  // 白露后 → 酉月
    {name:'寒露', m:10, d:8  },  // 寒露后 → 戌月
    {name:'立冬', m:11, d:7  },  // 立冬后 → 亥月
    {name:'大雪', m:12, d:7  }   // 大雪后 → 子月
  ];
  // 月支索引（寅=0 … 丑=11）
  const YUE_ZHI_IDX = {寅:0,卯:1,辰:2,巳:3,午:4,未:5,申:6,酉:7,戌:8,亥:9,子:10,丑:11};

  // ── 工具 ──────────────────────────────────────────────
  function isLeap(y) {
    return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
  }
  function daysInYear(y) { return isLeap(y) ? 366 : 365; }
  // 该日期距离"公元元年1月1日"的天数（日序），支持跨年精确计算
  function dayNumber(y, m, d) {
    let days = 0;
    for (let i = 1; i < y; i++) days += daysInYear(i);
    const dm = [31, isLeap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    for (let i = 0; i < m - 1; i++) days += dm[i];
    return days + d;
  }
  function daysBetween(y1,m1,d1,y2,m2,d2) {
    return dayNumber(y2,m2,d2) - dayNumber(y1,m1,d1);
  }

  // ── 年柱 ──────────────────────────────────────────────
  // 以立春（2/4）为界
  function yearGanZhi(year, month, day) {
    let y = year;
    if (month < 2 || (month === 2 && day < 4)) y -= 1;
    const s = ((y - 4) % 10 + 10) % 10;
    const b = ((y - 4) % 12 + 12) % 12;
    return { gan: TIAN_GAN[s], zhi: DI_ZHI[b], yearDisplay: year };
  }

  // ── 月柱 ──────────────────────────────────────────────
  // 以节气为界。月支按公历区间判定：
  //   立春(2/4)后→寅、惊蛰(3/5)后→卯、清明(4/4)后→辰、立夏(5/5)后→巳、
  //   芒种(6/5)后→午、小暑(7/7)后→未、立秋(8/7)后→申、白露(9/7)后→酉、
  //   寒露(10/8)后→戌、立冬(11/7)后→亥、大雪(12/7)后→子、小寒(1/5)后→丑；
  //   立春(2/4)前：2月初或小寒(1/5)后→丑，1/5之前→子（上年大雪后）
  function monthZhi(month, day) {
    if (month > 2 || (month === 2 && day >= 4)) {
      const bounds = [[3,5],[4,4],[5,5],[6,5],[7,7],[8,7],[9,7],[10,8],[11,7],[12,7]];
      const zhis = ['寅','卯','辰','巳','午','未','申','酉','戌','亥','子','丑'];
      let idx = 0; // 默认寅
      for (let i = 0; i < bounds.length; i++) {
        if (month > bounds[i][0] || (month === bounds[i][0] && day >= bounds[i][1])) idx = i + 1;
        else break;
      }
      return zhis[idx];
    }
    return (month === 2 || (month === 1 && day >= 5)) ? '丑' : '子';
  }
  function monthGanZhi(yearGanIdx, month, day) {
    const zhi = monthZhi(month, day);
    const zhiIdx = DI_ZHI.indexOf(zhi); // 寅=2 … 丑=1
    // 五虎遁：寅月天干 = (年干序*2+2)%10（甲己之年丙作首 → 甲年=0 → 2=丙）
    const yinGan = (yearGanIdx * 2 + 2) % 10;
    // 月干 = 寅月干 + 月序 mod 10；月序 = (当前月支序 - 寅序) mod 12
    // （子月 = 寅月 + 10 地支位 → 天干 +10 mod 10 = 不变；丑月 = +11 → +1）
    const ganIdx = (yinGan + (zhiIdx - 2 + 12) % 12) % 10;
    return { gan: TIAN_GAN[ganIdx], zhi: zhi, zhiIdx: zhiIdx };
  }

  // ── 日柱 ──────────────────────────────────────────────
  // 基准：2000-01-01 = 戊午（Ganzhi 索引 54）
  const REF_YEAR = 2000, REF_MONTH = 1, REF_DAY = 1, REF_GZ = 54;
  function dayGanZhi(year, month, day) {
    // diff = 目标日期 相对 基准日 的天数（正=之后，负=之前）
    const diff = daysBetween(REF_YEAR, REF_MONTH, REF_DAY, year, month, day);
    const idx = ((REF_GZ + diff) % 60 + 60) % 60;
    return {
      gan: TIAN_GAN[idx % 10],
      zhi: DI_ZHI[idx % 12],
      idx: idx
    };
  }

  // ── 时柱 ──────────────────────────────────────────────
  // 时辰 → 地支索引：子0 丑1 … 亥11
  function shichenToZhiIdx(sc) {
    return SHI_CHEN.indexOf(sc);
  }
  function hourGanZhi(dayGanIdx, shichen) {
    const zhiIdx = shichenToZhiIdx(shichen);
    // 五鼠遁：子时天干
    const ziGan = (dayGanIdx * 2) % 10;
    const ganIdx = (ziGan + zhiIdx) % 10;
    return { gan: TIAN_GAN[ganIdx], zhi: DI_ZHI[zhiIdx] };
  }

  // ── 纳音 ──────────────────────────────────────────────
  function naYin(ganIdx, zhiIdx) {
    // Ganzhi 索引 = ganIdx*6 + zhiIdx 不对，直接用 (ganIdx, zhiIdx) 对应的 60 循环序号
    // 序号 = 满足 n%10==ganIdx && n%12==zhiIdx 的最小非负整数 n
    // 直接线性搜索（60 以内）
    for (let n = 0; n < 60; n++) {
      if (n % 10 === ganIdx && n % 12 === zhiIdx) return NA_YIN[n];
    }
    return '?';
  }

  // ── 五行统计 ──────────────────────────────────────────
  function wuxingCount(gan, zhi) {
    const cnt = { 金:0, 木:0, 水:0, 火:0, 土:0 };
    cnt[WUXING[gan]]++;
    cnt[WUXING[zhi]]++;
    return cnt;
  }

  // ── 日主强弱简判 ──────────────────────────────────────
  function judgeDayMaster(dayGan, monthZhi, yearZhi, dayZhi, allGan, allZhi) {
    const dayWx = WUXING[dayGan];
    const monthWx = WUXING[monthZhi];
    let score = 0;
    // 得令：月支五行 = 日干五行 → +2；月支生日干 → +1；月支克日干 → -2
    if (monthWx === dayWx) score += 2;
    else if (wxSheng(monthWx, dayWx)) score += 1;
    else if (wxKe(monthWx, dayWx)) score -= 2;

    // 得地：年支、日支与日干同五行各 +1
    if (WUXING[yearZhi] === dayWx) score += 1;
    if (WUXING[dayZhi] === dayWx) score += 1;

    // 得势：年干、月干、时干、时支与日干同五行各 +1
    [allGan[0], allGan[1], allGan[3]].forEach(g => {
      if (WUXING[g] === dayWx) score += 1;
    });
    if (WUXING[allZhi[3]] === dayWx) score += 1;

    let level;
    if (score >= 4) level = '强';
    else if (score >= 2) level = '偏强';
    else if (score >= -1) level = '中和';
    else if (score >= -3) level = '偏弱';
    else level = '弱';
    return { score, level };
  }

  const WX_KE   = { 金:'木', 木:'土', 土:'水', 水:'火', 火:'金' };
  function wxSheng(a, b) { return WX_SHENG[a] === b; }
  function wxKe(a, b)    { return WX_KE[a]    === b; }

  // ── 主入口 ────────────────────────────────────────────
  // 参数：year, month, day, shichen（地支名如'子'）
  // 返回排盘对象
  function paiPan(year, month, day, shichen) {
    const yz = yearGanZhi(year, month, day);
    const yearGanIdx = TIAN_GAN.indexOf(yz.gan);

    const mz = monthGanZhi(yearGanIdx, month, day);
    const dz = dayGanZhi(year, month, day);
    const dayGanIdx = TIAN_GAN.indexOf(dz.gan);

    const hz = hourGanZhi(dayGanIdx, shichen);

    const allGan = [yz.gan, mz.gan, dz.gan, hz.gan];
    const allZhi = [yz.zhi, mz.zhi, dz.zhi, hz.zhi];

    const wx = { 金:0, 木:0, 水:0, 火:0, 土:0 };
    allGan.forEach(g => wx[WUXING[g]]++);
    allZhi.forEach(z => wx[WUXING[z]]++);
    // 藏干也计入（传统用法中藏干参与旺衰分析，此处仅统计主气）
    // 藏干统计可选：
    const cx = { 金:0, 木:0, 水:0, 火:0, 土:0 };
    allZhi.forEach(z => CANG_GAN[z].forEach(g => cx[WUXING[g]]++));

    const judges = allZhi.map(z => ({
      zhi: z,
      cang: CANG_GAN[z],
      naYin: naYin(TIAN_GAN.indexOf(allGan[allZhi.indexOf(z)]), DI_ZHI.indexOf(z))
    }));

    // 修正纳音：按柱分别取
    const naYinArr = [
      naYin(TIAN_GAN.indexOf(yz.gan),  DI_ZHI.indexOf(yz.zhi)),
      naYin(TIAN_GAN.indexOf(mz.gan),  DI_ZHI.indexOf(mz.zhi)),
      naYin(TIAN_GAN.indexOf(dz.gan),  DI_ZHI.indexOf(dz.zhi)),
      naYin(TIAN_GAN.indexOf(hz.gan),  DI_ZHI.indexOf(hz.zhi))
    ];

    const dm = judgeDayMaster(dz.gan, mz.zhi, yz.zhi, dz.zhi, allGan, allZhi);

    return {
      year:  yz,
      month: mz,
      day:   dz,
      hour:  hz,
      allGan,
      allZhi,
      wuxing: wx,
      cangWuxing: cx,
      naYin: naYinArr,
      dayMaster: { gan: dz.gan, level: dm.level, score: dm.score },
      cangGan: allZhi.map(z => CANG_GAN[z])
    };
  }

  // ── 导出 ──────────────────────────────────────────────
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = { paiPan, TIAN_GAN, DI_ZHI, WUXING, CANG_GAN, NA_YIN };
  } else {
    global.bazi = { paiPan };
  }
})(typeof window !== 'undefined' ? window : global);

    if (state.phase !== 'hour') return;
    state.shichen = '午';
    state.phase = 'reading';
    controls.innerHTML = '';
    userSay('时辰记不清了');
    masterSay('无妨。时辰不详，便以午时（正午）为凭，大体不差。贫道这就为你推演。', null, function () { readNow(); });
  }

  // ── 排盘 + 解读 ──
  function readNow() {
    var b;
    try {
      b = bazi.paiPan(state.y, state.m, state.d, state.shichen);
    } catch (e) {
      masterSay('这生辰……贫道一时推演不得，施主可重新填一回。', null, function () {
        state.phase = 'date';
        renderControls();
      });
      return;
    }
    var texts = buildReading(b);
    state.readingDone = true;
    state.readCount++;
    masterSay(texts[0]);
    masterSay(texts[1]);
    masterSay(texts[2], panHTML(b));
    state.phase = 'done';
    masterSay('—— 这便是你的命盘，收好。心里若有结，随时再来寻贫道。', null, function () {
      renderControls();
    });
  }

  function buildReading(b) {
    var d = state.direction;
    var dm = b.dayMaster.gan;
    var dmWx = GAN_WX[dm];
    var lv = b.dayMaster.level;
    var wx = b.wuxing;

    var order = ['木', '火', '土', '金', '水'];
    var strong = order[0], weak = order[0];
    order.forEach(function (k) {
      if (wx[k] > wx[strong]) strong = k;
      if (wx[k] < wx[weak]) weak = k;
    });

    var na = b.naYin[2];
    var naEl = na.charAt(na.length - 1);
    var flavor = NAYIN_FLAVOR[naEl] || '平和';

    // 1) 共情安抚
    var emPool = EMPATHY[d];
    var em = emPool[state.emIdx++ % emPool.length];

    // 2) 缘由：日主 + 旺衰 + 纳音
    var base = '依贫道所看，你的日主是“' + dm + '”，属' + dmWx + '。' + STR[d][lv] + '。';
    var wangshuai;
    if (strong === weak) {
      wangshuai = '你的五行分布颇为均衡，不偏不倚，这样的命格最经得起折腾。';
    } else {
      wangshuai = '命局之中，' + strong + '气最盛，' + weak + '气稍欠。' +
                  WX_TRAIT[strong].strong + '；' + WX_TRAIT[weak].weak + '。';
    }
    var naPart = '日柱纳音为“' + na + '”，命带' + flavor + '之性，' + (NAYIN_NOTE[naEl] || '自有一番气象') + '。';
    var reason = base + wangshuai + naPart;

    // 3) 建议：方向建议 + 补弱行动 + 收尾
    var act = (strong === weak) ? '' : '你命里' + weak + '气稍欠，' + WX_ACTION[weak];
    var advice = ADV[d][lv] + act + CLOSE[d];

    return [em, reason, advice];
  }

  function panHTML(b) {
    var pillars = [
      ['年', b.allGan[0], b.allZhi[0], b.naYin[0]],
      ['月', b.allGan[1], b.allZhi[1], b.naYin[1]],
      ['日', b.allGan[2], b.allZhi[2], b.naYin[2]],
      ['时', b.allGan[3], b.allZhi[3], b.naYin[3]]
    ];
    return '<div class="pan">' +
      '<div class="p-title">—— 命 盘 ——</div>' +
      '<div class="row">' +
      pillars.map(function (p) {
        return '<div class="pillar"><span>' + p[0] + '柱</span><b>' + p[1] + p[2] + '</b><span>' + p[3] + '</span></div>';
      }).join('') +
      '</div>' +
      '<div class="meta">' +
      '<span>日主：<b>' + b.dayMaster.gan + '</b>（' + GAN_WX[b.dayMaster.gan] + '）· ' + b.dayMaster.level + '</span>' +
      '<span>金' + b.wuxing['金'] + ' 木' + b.wuxing['木'] + ' 水' + b.wuxing['水'] + ' 火' + b.wuxing['火'] + ' 土' + b.wuxing['土'] + '</span>' +
      '</div>' +
      '</div>';
  }

  // ── 自由输入 ──
  function handleFree() {
    var v = freeInput.value.trim();
    if (!v) return;
    freeInput.value = '';
    userSay(v);
    if (!state.readingDone) {
      masterSay('施主莫急。先点了想问的方向，再把生辰告诉贫道，贫道自当细细为你说。');
      return;
    }
    var reply = CHAT_REPLY[state.readCount % CHAT_REPLY.length];
    masterSay(reply);
  }

  // ── 重置 ──
  function resetAll() {
    state = {
      direction: null, y: null, m: null, d: null, shichen: null,
      readingDone: false, readCount: 0, emIdx: 0, phase: 'init'
    };
    chat.innerHTML = '';
    controls.innerHTML = '';
    start();
  }

  // ── 事件绑定与启动 ──
  sendBtn.addEventListener('click', handleFree);
  freeInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') handleFree();
  });
  start();
})();
</script>
</body>
</html>
